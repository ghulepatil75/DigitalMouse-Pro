name: Build Digital Mouse Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle Wrapper
        run: |
          GRADLEW=$(find . -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            exit 1
          fi
          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: chmod +x "$GRADLEW"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitalMouse-Pro-debug
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Gradle project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --version

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."
          find "$PROJECT_DIR/app/build/outputs" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitalMouse-Pro-debug
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew was not found."
            echo "Your Android project must contain a Gradle wrapper."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "Gradle wrapper found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Check Gradle
        run: "$PROJECT_DIR/gradlew" --version

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Find APK
        run: |
          echo "Generated APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitalMouse-Pro-debug
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error          if-no-files-found: error
